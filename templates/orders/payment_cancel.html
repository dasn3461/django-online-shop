{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="section-content padding-y bg">
<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-center p-4">
                <div class="card-body">
                    <span class="text-warning" style="font-size: 60px;">
                        <i class="fas fa-exclamation-triangle"></i>
                    </span>
                    <h3 class="card-title mt-3">Payment Cancelled</h3>
                    <p class="card-text text-muted">You have cancelled the payment process.</p>
                    
                    <a href="{% url 'cart' %}" class="btn btn-primary mt-3">Back to Cart</a>
                </div>
            </div>
        </div>
    </div>

</div>
</section>
{% endblock %}
